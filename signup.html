
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CampusFind</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 430px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-container h1 { margin-bottom: 10px; }
        .auth-container label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .auth-container input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 8px;
            font: inherit;
        }
        .auth-container button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #173f7a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
        }
        #message { margin-top: 14px; }
    </style>
</head>
<body>
    <main class="auth-container">
        <h1>Create your account</h1>
        <p>Join CampusFind to help reunite lost items with their owners.</p>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text"
                   autocomplete="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password (minimum 8 characters)</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <p id="message" role="status"></p>
        <p>Already have an account? <a href="login.html">Log in</a></p>
        <p><a href="index.html">Back to Home</a></p>
    </main>

    <script>
        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");

        signupForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            message.textContent = "Creating your account...";

            const details = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/api/signup",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(details)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Signup failed.");
                }

                message.textContent =
                    "Account created! You can now log in.";
                signupForm.reset();
            } catch (error) {
                message.textContent = error.message ||
                    "Could not connect. Check whether Flask is running.";
            }
        });
    </script>
</body>
</html>
